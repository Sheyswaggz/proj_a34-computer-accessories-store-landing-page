version: '3.9'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: computer-accessories-store
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./status.json:/usr/share/nginx/html/status.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/status.json"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
